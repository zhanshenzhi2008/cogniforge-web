# =============================================================================
# cogniforge-web 生产部署
# 部署位置：/opt/project/cogniforge/docker-compose-web.yml
# 单部署根目录：三个仓的 compose 都集中到 /opt/project/cogniforge/
# 方案 A：Traefik 仅路由本服务；Nginx 通过 cogniforge-net 代理 /api/*。
# 镜像：CD 流程构建并推到 ghcr.io，此处只 pull + up
# 配置：DOMAIN / 镜像命名空间由同部署目录的 .env 或 Portainer Stack
#       environment variables 提供；前端 API 地址在镜像构建时固定为 /api。
# =============================================================================

services:
  cogniforge-web:
    image: ghcr.io/${IMAGE_NAMESPACE:-zhanshenzhi2008}/cogniforge/cogniforge-web:latest
    container_name: cogniforge-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - cogniforge-net
      - proxy
    labels:
      # 唯一的公网入口。DOMAIN 缺失时拒绝部署，避免产生 Host(``) 路由。
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cogniforge-web.rule=Host(`${DOMAIN:?Set DOMAIN in .env or Portainer Stack environment variables}`)"
      - "traefik.http.routers.cogniforge-web.entrypoints=websecure"
      - "traefik.http.routers.cogniforge-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.cogniforge-web.loadbalancer.server.port=80"
    # Traefik v3 会过滤 unhealthy/starting 容器（日志：Filtering unhealthy or starting container）
    # nginx 监听 80；/health 为精确 location（见 nginx.conf），勿用 3000 或 /health/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cogniforge-net:
    external: true
    name: cogniforge-net
  proxy:
    external: true
    name: proxy
